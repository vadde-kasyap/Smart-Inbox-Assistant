server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=Oracle;DB_CLOSE_DELAY=-1;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

app:
  storage:
    path: ./target/test-storage

mailbox:
  type: mock
  poll:
    enabled: false
  mock:
    path: ../test-data/emails

queue:
  capacity: 100
  worker:
    enabled: true
    concurrency: 1
